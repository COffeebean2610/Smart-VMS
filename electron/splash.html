<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart VMS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 12px;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      width: 100%;
    }

    .logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(59, 130, 246, 0.1) 60%, transparent 80%);
      border-radius: 50%;
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      from { opacity: 0.4; transform: scale(0.95); }
      to { opacity: 0.9; transform: scale(1.1); }
    }

    .logo-img {
      position: relative;
      width: 90px;
      height: 90px;
      object-fit: contain;
      animation: logoScale 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes logoScale {
      from { transform: scale(0.9); }
      to { transform: scale(1.05); }
    }

    .app-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .app-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .progress-bar-track {
      width: 260px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
      border-radius: 4px;
      animation: progressLoad 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes progressLoad {
      0% { width: 0%; }
      30% { width: 35%; }
      70% { width: 75%; }
      100% { width: 100%; }
    }

    .status-text {
      margin-top: 10px;
      font-size: 10px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="icon.png" alt="Smart VMS Logo" class="logo-img" />
    </div>

    <h1 class="app-title">Smart VMS</h1>
    <p class="app-subtitle">Beyond Surveillance. Intelligent Security.</p>

    <div class="progress-bar-track">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text">Initializing Security Engines...</div>
  </div>
</body>
</html>
